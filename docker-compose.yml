
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: actionguard-backend
    ports:
      - "8081:8081"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: actionguard-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
