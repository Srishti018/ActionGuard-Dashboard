
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: actionguard-backend
    ports:
      - "8081:8081"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: actionguard-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
    
  prometheus:
    image: prom/prometheus:latest
    container_name: actionguard-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - backend
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: actionguard-grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

